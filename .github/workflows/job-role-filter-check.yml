name: Job Role Filter Check

on:
  push:
    branches:
      - feat/job-role-filter

jobs:
  role-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --import tsx --test src/lib/job-role.test.ts
      - run: npm run typecheck
