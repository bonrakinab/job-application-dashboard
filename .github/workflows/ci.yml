name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build

  production-http-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://job-application-dashboard-fx6j.vercel.app/api/health \
            -o /tmp/health.json
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          console.log(JSON.stringify(h, null, 2));
          if (!h.ok) throw new Error('Production health is not ok');
          if (h.mode !== 'persistent') throw new Error(`Unexpected mode: ${h.mode}`);
          if (h.aiProvider !== 'gemini') throw new Error(`Unexpected AI provider: ${h.aiProvider}`);
          if (!h.checks?.supabase || !h.checks?.dashboardAuth || !h.checks?.ai || !h.checks?.gemini || !h.checks?.gmailOauth) {
            throw new Error('One or more required production health checks are false');
          }
          NODE

      - name: Verify private API remains protected
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error -o /tmp/profile.json -w '%{http_code}' \
            https://job-application-dashboard-fx6j.vercel.app/api/profile)
          echo "profile_http=$code"
          cat /tmp/profile.json
          test "$code" = "401"

      - name: Verify target-company group route exists behind login
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --head \
            'https://job-application-dashboard-fx6j.vercel.app/target-jobs?group=canadian-banks' \
            -o /tmp/target.headers
          cat /tmp/target.headers
          status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/target.headers)
          case "$status" in
            200|302|303|307|308) ;;
            *) echo "Unexpected target-jobs status: $status"; exit 1 ;;
          esac
          if grep -qi '^location:' /tmp/target.headers; then
            grep -qi '/login' /tmp/target.headers
          fi

      - name: Verify target companies page exists behind login
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --head \
            https://job-application-dashboard-fx6j.vercel.app/companies \
            -o /tmp/companies.headers
          cat /tmp/companies.headers
          status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/companies.headers)
          case "$status" in
            200|302|303|307|308) ;;
            *) echo "Unexpected companies status: $status"; exit 1 ;;
          esac
